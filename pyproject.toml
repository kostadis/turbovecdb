[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[tool.maturin]
# Mixed Python/Rust project: Python package lives in src/, the Rust core is
# compiled into the extension module turbovecdb._core. The Rust side is a
# Cargo workspace (see docs/rust-core-split-design.md): turbovecdb-core is
# the pure engine, turbovecdb-py is the PyO3 adapter maturin actually builds.
manifest-path = "crates/turbovecdb-py/Cargo.toml"
python-source = "src"
module-name = "turbovecdb._core"
features = ["pyo3/extension-module"]

[project]
name = "turbovecdb"
version = "0.5.0"
description = "An embedded vector database: turbovec 4-bit ANN + a durable SQLite store, with metadata filters, persistence, exact-cosine re-rank, and multi-process safety."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kostadis Rousoss", email = "kostadis@gmail.com" }]
keywords = ["vector-database", "embeddings", "ann", "turbovec", "quantization"]
# The turbovec ANN engine is a native Rust dependency of the extension module
# (statically linked, OpenBLAS included) — the turbovec PyPI wheel is NOT a
# runtime dependency anymore. Neither is filelock: the cross-process write
# lock now lives in the Rust core (flock), so filelock is a test-only
# dependency (the suite uses it as the opposing lock holder to prove
# old-wheel/new-wheel interop — see the dev group below).
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
# filelock is test-only: the tests hold a Python filelock.FileLock on a
# collection's <name>.lock to contend with the Rust core's flock, proving the
# two implementations exclude each other (invariant I3).
dev = ["pytest>=7.0", "ruff>=0.4.0", "filelock>=3.12"]

[project.scripts]
turbovecdb-service = "turbovecdb.service:main"

[project.urls]
Homepage = "https://github.com/kostadis/turbovecdb"
Repository = "https://github.com/kostadis/turbovecdb"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "perf: performance and scale tests (slower; run/skip with -m perf / -m 'not perf')",
]
