[package]
name = "turbovecdb-core"
version = "0.1.0"
edition = "2021"
description = "Pure Rust engine for turbovecdb (no PyO3/Python dependency)"
license = "MIT"

[dependencies]
log = "0.4"
siphasher = "0.3"
rand = "0.8"
libc = "0.2"
ndarray = "0.16"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1.0.150"
turbovec = "1.0"

[dev-dependencies]
# "hooks" (commit_hook) and "trace" (Connection::trace) are test-only:
# resolver v2 keeps them out of the production build. commit_hook
# deterministically forces a COMMIT failure (C2 regression test); trace
# fires at statement boundaries, used to inject a concurrent writer's
# commit exactly between query()'s allowlist and re-rank SELECTs (C3
# regression test).
rusqlite = { version = "0.32", features = ["bundled", "hooks", "trace"] }
